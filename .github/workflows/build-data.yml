name: Rebuild chart data

# Regenerates data/*.csv (read live by the Datawrapper charts) whenever index.html changes.
on:
  push:
    branches: [main]
    paths: [index.html, scripts/build-data.js]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-data.js
      - name: Commit data if it changed
        run: |
          if git diff --quiet -- data; then
            echo "Chart data already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Rebuild chart data"
            git push
          fi
